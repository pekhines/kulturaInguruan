# Robota GitHub-en exekutatzen du eta datu berriak gordetzen ditu.
# GitHub Pages-ek docs/ karpeta argitaratzen du, beraz webgunea automatikoki eguneratzen da.
#
# Erritmoa:
#   - Egunero:          iturri egituratuak (azkarrak, LLMrik gabe)
#   - Astearteetan:     udal webguneak eta agendak berriro bilatu (ostegunerako prest egoteko)
#   - Ostegunetan:      dena, LLM agendak barne (asteburuko ekitaldiak harrapatzeko;
#                       cacheari esker, aldatutako orriak bakarrik)
#   - Eskuz ("Run workflow" botoia): dena, LLM barne
#   - Jarraipenak:      LLM agendak denbora-mugara iristen badira (doako ereduak motelak dira),
#                       workflow-ak bere burua berriz abiarazten du egun berean, LLM agendak
#                       bakarrik eginez; cacheari esker utzitako orritik jarraitzen du.
#                       Gehienez JARRAIPEN_MUGA aldiz egunean.
#
# LLM gakoa: Settings → Secrets and variables → Actions → "New repository secret"
#   Izena: OPENROUTER_API_KEY   (ez da inoiz biltegian gordetzen)
#
# Etxeko VPN-a (aukerakoa): WIREGUARD_KONFIG secret-a. Robotaren eskaera guztiak etxetik doaz
# (git push eta GitHub-eko trafikoa ez). Ikus robota/vpn_piztu.sh eta robota/vpn_bidez.sh
name: Ekitaldiak bildu

on:
  schedule:
    - cron: "0 4 * * *"     # egunero 04:00etan (UTC)
  workflow_dispatch:         # eskuz ere exekutatu daiteke, GitHub-eko "Actions" fitxatik
    inputs:
      jarraipena:
        description: "Jarraipen-zenbakia (0 = exekuzio osoa; >0 = LLM agendak bakarrik, robotak berak jartzen du)"
        required: false
        default: "0"

permissions:
  contents: write
  actions: write   # LLM agendak amaitu gabe badaude, workflow-a berriz abiarazteko

env:
  JARRAIPENA: ${{ inputs.jarraipena || '0' }}
  JARRAIPEN_MUGA: "8"

# Bi exekuzio aldi berean ez (bestela biek idatziko lukete JSONa)
concurrency:
  group: ekitaldiak-bildu
  cancel-in-progress: false

jobs:
  bildu:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      # Webgune askok GitHub-eko IPak blokeatzen edo mugatzen dituzte (Cloudflare 403, Iruñea 502…):
      # robotaren eskaera guztiak etxeko WireGuard VPN-tik (secret-a: WIREGUARD_KONFIG)
      - name: Etxeko VPN-a piztu (robotaren eskaera guztietarako)
        continue-on-error: true   # VPN-a huts eginda ere, robotak zuzenean jarraitzen du
        env:
          WIREGUARD_KONFIG: ${{ secrets.WIREGUARD_KONFIG }}
        run: bash robota/vpn_piztu.sh

      # Astearteetan (%u = 2): udal webguneak berriro aztertu (agenda berriak, aldaketak…)
      - name: Udal agendak aurkitu (astearteetan)
        if: github.event_name == 'schedule'
        run: |
          if [ "$(date -u +%u)" = "2" ]; then
            bash robota/vpn_bidez.sh python robota/webguneak_asmatu.py
            bash robota/vpn_bidez.sh python robota/agendak_aurkitu.py
          fi

      - name: Robota exekutatu
        id: robota
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          # Doako LLM ereduak motelak dira: robota abiatu eta 115 minutura ez da LLM dei berririk egiten
          # (lanak 150 minutu ditu gehienez: azken deia, esportazioa eta commit-a egiteko tartea;
          # gainerako orriak jarraipen-exekuzio batean)
          LLM_MINUTUAK: "115"
        run: |
          if [ "$JARRAIPENA" != "0" ]; then
            echo "Jarraipena $JARRAIPENA/$JARRAIPEN_MUGA: LLM agendak bakarrik"
            bash robota/vpn_bidez.sh python robota/bildu.py "LLM agendak"
          # Ostegunetan (%u = 4) edo eskuz: exekuzio osoa
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ] || [ "$(date -u +%u)" = "4" ]; then
            echo "Exekuzio osoa (LLM agendak barne)"
            bash robota/vpn_bidez.sh python robota/bildu.py
          else
            echo "Eguneko exekuzioa (LLMrik gabe)"
            bash robota/vpn_bidez.sh python robota/bildu.py --salbu "LLM agendak"
          fi

      - name: VPN-a itzali
        if: always()
        run: |
          sudo ip netns del etxea 2>/dev/null || true

      - name: Aldaketak gorde
        id: gorde
        if: always()   # iturri bat hautsita ere, besteen datuak gorde
        run: |
          git config user.name "kultura-robota"
          git config user.email "kultura-robota@users.noreply.github.com"
          git add docs/datuak robota/cache robota/agendak.json robota/udal_webguneak.json
          git diff --cached --quiet || git commit -m "Ekitaldiak eguneratu $(date -u +%Y-%m-%d)$([ "$JARRAIPENA" != "0" ] && echo " (LLM jarraipena $JARRAIPENA)")"
          # Exekuzioak irauten duen bitartean main aurreratu bada (kode-aldaketak…), gure commit-a
          # haren gainean jarri; datuak eta kodea fitxategi desberdinak dira, ez dago gatazkarik
          for saiakera in 1 2 3; do
            git pull --rebase -q origin "${{ github.ref_name }}" && git push && break
            echo "::warning::git push-ek huts egin du ($saiakera. saiakera); berriz"
            sleep 5
          done
          # Igo gabeko commit-ik geratzen bada, urratsak huts egin (eta jarraipena ez abiarazi)
          [ -z "$(git log "origin/${{ github.ref_name }}..HEAD" --oneline)" ]

      # LLM agendak amaitu gabe: exekuzio berria orain bertan (datuak eta cachea jada gordeta daude)
      - name: LLM agendekin jarraitu (egun berean)
        if: always() && steps.gorde.outcome == 'success' && steps.robota.outputs.llm_amaitu_gabe == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          hurrengoa=$((JARRAIPENA + 1))
          if [ "$hurrengoa" -gt "$JARRAIPEN_MUGA" ]; then
            echo "::warning::LLM agendak amaitu gabe, baina $JARRAIPEN_MUGA jarraipenen mugara iritsi gara"
            exit 0
          fi
          gh workflow run egunero.yml --ref "${{ github.ref_name }}" -f jarraipena="$hurrengoa"
          echo "Jarraipena $hurrengoa abiarazita"
